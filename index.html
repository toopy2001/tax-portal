<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Cache-Control" content="no-cache">
<title>세무 업무 포털</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --side:#0d1830; --side2:#18284a; --side-ink:#c8d1e4; --side-mute:#7b89aa; --gold:#c49a3c;
    --bg:#f2f4f8; --panel:#fff; --ink:#131a2b; --mute:#5c6780; --line:#e1e6ee; --line2:#edf0f5; --head:#f8f9fc;
    --accent:#1d4ed8; --accent-soft:#ebf1fe; --ok:#0f7b5f; --ok-soft:#e3f4ed;
    --warn:#975a00; --warn-soft:#fdf3e2; --red:#b42318; --red-soft:#fdecea; --gray-soft:#f1f3f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:Pretendard,"Noto Sans KR",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .hidden{display:none!important}
  .app{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}

  /* ── 사이드바 ── */
  .side{background:var(--side);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px 16px;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:11px;padding:0 8px 22px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:16px}
  .brand .mk{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--gold),#8c6a22);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;letter-spacing:-.04em}
  .brand b{display:block;color:#fff;font-size:15px;letter-spacing:-.02em}
  .brand small{display:block;color:var(--side-mute);font-size:11px;letter-spacing:.06em}
  .nav-label{font-size:11px;color:var(--side-mute);letter-spacing:.08em;padding:0 10px 8px}
  .nav{display:flex;flex-direction:column;gap:2px}
  .nav-i{display:flex;align-items:center;gap:11px;width:100%;border:none;background:none;color:var(--side-ink);padding:9px 12px;border-radius:8px;font:500 14px/1.3 inherit;cursor:pointer;text-align:left}
  .nav-i svg{width:18px;height:18px;flex:none;opacity:.8}
  .nav-i .ic-emoji{width:18px;text-align:center;flex:none}
  .nav-i em{margin-left:auto;font-style:normal;font-size:11px;color:var(--side-mute);background:rgba(255,255,255,.06);padding:1px 7px;border-radius:999px}
  .nav-i:hover{background:rgba(255,255,255,.05);color:#fff}
  .nav-i.on{background:var(--side2);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
  .nav-i.on svg{opacity:1}
  .side-box{margin-top:auto;padding:14px 10px 0;border-top:1px solid rgba(255,255,255,.07)}
  .side-box h5{margin:0 0 8px;font-size:12px;color:#fff;font-weight:600;display:flex;justify-content:space-between}
  .side-box h5 span{color:var(--side-mute);font-weight:400}
  .side-box ul{margin:0;padding:0;list-style:none;font-size:12.5px}
  .side-box li{padding:5px 0 5px 12px;position:relative;color:var(--side-ink)}
  .side-box li::before{content:"";position:absolute;left:0;top:12px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .sync{margin-top:14px;font-size:11.5px;color:var(--side-mute)}

  /* ── 본문 ── */
  .main{padding:26px 34px 48px;min-width:0}
  .top{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:18px}
  .crumb{font-size:12px;color:var(--mute);margin-bottom:4px}
  .crumb b{color:var(--ink);font-weight:600}
  .top h1{margin:0;font-size:23px;font-weight:700;letter-spacing:-.025em}
  .top p{margin:3px 0 0;color:var(--mute);font-size:13px}
  .search{position:relative;width:360px;flex:none}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--mute)}
  .search input{width:100%;padding:10px 40px 10px 37px;font:14px inherit;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font:11px inherit;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--head)}
  .subtabs{display:flex;gap:4px;flex-wrap:wrap;margin:-4px 0 16px}
  .subtab{border:1px solid var(--line);background:var(--panel);color:var(--mute);padding:6px 13px;border-radius:7px;font:500 13px inherit;cursor:pointer}
  .subtab:hover{color:var(--ink)}
  .subtab.on{background:var(--ink);border-color:var(--ink);color:#fff}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:16px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .panel-h{display:flex;align-items:center;gap:8px;padding:11px 18px;border-bottom:1px solid var(--line);background:var(--head);font-weight:700;font-size:13.5px}
  .panel-h .n{font-size:11.5px;font-weight:500;color:var(--mute);background:var(--panel);border:1px solid var(--line);padding:0 7px;border-radius:999px}
  .empty{color:var(--mute);padding:40px 0;text-align:center}

  /* 표 */
  table.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
  .tbl th{font-size:11.5px;color:var(--mute);font-weight:600;text-align:left;padding:8px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  .tbl td{padding:12px 18px;border-top:1px solid var(--line2);vertical-align:top}
  .tbl tr:first-child td{border-top:none}
  .tbl tbody tr:hover td{background:#f7f9fe}
  .c-star{width:34px;padding-right:0!important}
  .c-name{width:230px}
  .c-name a{font-weight:600;text-decoration:none}
  .c-name a:hover{color:var(--accent)}
  .surl{font-size:12px;color:var(--mute);margin-top:1px;word-break:break-all}
  .c-desc{color:#3b4559}
  .c-tags{width:210px}
  .c-act{width:92px;text-align:right}
  .tag{display:inline-block;font-size:11.5px;color:var(--mute);background:var(--gray-soft);padding:1px 7px;border-radius:5px;margin:0 3px 3px 0}
  .star{border:none;background:none;cursor:pointer;color:#cdd3de;font-size:16px;padding:0;line-height:1}
  .star.on{color:var(--gold)}
  .btn-open{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;border:1px solid var(--line);padding:5px 11px;border-radius:6px;white-space:nowrap;background:var(--panel)}
  .btn-open:hover{background:var(--accent-soft);border-color:#c9d7fb}
  .btn-open.pri{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn-open.pri:hover{background:#1a43bd}

  /* 목록-상세 */
  .md{display:grid;grid-template-columns:310px minmax(0,1fr);gap:16px;align-items:start}
  .mlist{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
  .mitem{display:block;width:100%;text-align:left;border:none;background:none;padding:12px 18px;border-top:1px solid var(--line2);cursor:pointer;font:inherit;color:inherit}
  .mitem:first-of-type{border-top:none}
  .mitem:hover{background:#f7f9fe}
  .mitem.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .mitem .t{font-weight:600;font-size:14px;letter-spacing:-.01em}
  .mitem .s{font-size:12px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mitem .m{display:flex;gap:4px;margin-top:6px}
  .chip{font-size:11px;font-weight:600;padding:1px 7px;border-radius:5px;white-space:nowrap}
  .ch-원칙{background:var(--ok-soft);color:var(--ok)}
  .ch-예외{background:var(--warn-soft);color:var(--warn)}
  .ch-주의{background:var(--red-soft);color:var(--red)}
  .ch-회사{background:var(--accent-soft);color:var(--accent)}
  .ch-참고{background:var(--gray-soft);color:var(--mute)}
  .d-head{padding:20px 24px 16px;border-bottom:1px solid var(--line)}
  .d-head h2{margin:0;font-size:19px;letter-spacing:-.02em}
  .d-head p{margin:4px 0 10px;color:var(--mute);font-size:13.5px}
  .d-head .m{display:flex;gap:5px;flex-wrap:wrap}
  .d-sec{padding:6px 24px 18px}
  .d-sec + .d-sec{border-top:1px solid var(--line2)}
  .d-sec h4{margin:14px 0 4px;font-size:12px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
  .d-sec h4 i{width:8px;height:8px;border-radius:2px;display:inline-block}
  .srow{display:grid;grid-template-columns:30px 160px minmax(0,1fr);gap:14px;padding:12px 0;border-top:1px dashed var(--line)}
  .d-sec h4 + .srow{border-top:none}
  .num{width:26px;height:26px;border-radius:50%;background:var(--side);color:#fff;font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .slab{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}
  .site-chip{display:inline-block;font-size:12.5px;font-weight:600;color:var(--accent);text-decoration:none;background:var(--accent-soft);padding:3px 9px;border-radius:6px;line-height:1.4}
  a.site-chip:hover{text-decoration:underline}
  .site-chip.plain{color:#3b4559;background:var(--gray-soft)}
  .site-chip.none{color:#a3abbb;background:none;padding-left:0}
  .stodo{font-weight:600;font-size:14px;letter-spacing:-.01em}
  .snote{font-size:13px;color:var(--mute);margin-top:3px;line-height:1.6}

  .steps{list-style:none;margin:14px 0 4px;padding:0;counter-reset:st}
  .steps li{counter-increment:st;position:relative;padding:9px 0 9px 38px;border-top:1px solid var(--line2)}
  .steps li:first-child{border-top:none}
  .steps li::before{content:counter(st);position:absolute;left:0;top:9px;width:24px;height:24px;border-radius:50%;background:var(--side);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .sl{display:flex;flex-wrap:wrap;align-items:center;gap:7px;font-size:14.5px;line-height:1.5}
  .sl b{font-weight:600;letter-spacing:-.01em}
  .sn{font-size:13px;color:var(--mute);margin-top:2px}
  .stag{display:inline-block;font-size:12px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:1px 8px;border-radius:5px;text-decoration:none;line-height:1.6;white-space:nowrap}
  a.stag:hover{text-decoration:underline}
  .stag.plain{color:#3b4559;background:var(--gray-soft)}
  .notes{margin:6px 0 4px;padding-left:18px;font-size:13.5px;color:#3b4559}
  .notes li{padding:4px 0;line-height:1.6}
  .notes b{color:var(--ink);font-weight:600}
  .d-sec h4 .chip{font-size:11.5px}
  .ch-포함{background:var(--ok-soft);color:var(--ok)}
  .ch-제외{background:var(--red-soft);color:var(--red)}
  .ie-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0 6px}
  .ie{border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .ie h4{margin:0!important;padding:10px 14px;font-size:13.5px!important;display:flex;align-items:center;gap:6px}
  .ie h4 .n{font-size:11px;font-weight:500;color:var(--mute);border:1px solid var(--line);background:#fff;padding:0 7px;border-radius:999px}
  .ie.in h4{background:var(--ok-soft);color:var(--ok)}
  .ie.ex h4{background:var(--red-soft);color:var(--red)}
  .ie ul{list-style:none;margin:0;padding:4px 14px 8px}
  .ie li{padding:7px 0;border-top:1px solid var(--line2);font-size:13.5px}
  .ie li:first-child{border-top:none}
  .ie li b{font-weight:600;display:block}
  .ie li span{display:block;font-size:12.5px;color:var(--mute);margin-top:1px}
  @media (max-width:900px){ .ie-wrap{grid-template-columns:1fr} }
  /* 서류 */
  .kind{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:5px;white-space:nowrap}
  .k-서식{background:var(--accent-soft);color:var(--accent)}
  .k-첨부{background:var(--warn-soft);color:var(--warn)}
  .k-발급{background:var(--ok-soft);color:var(--ok)}
  .k-안내{background:var(--gray-soft);color:var(--mute)}
  .c-kind{width:70px}
  .docs .tbl td:nth-child(2){width:38%}
  .dname{font-weight:600}
  .dlaw{font-size:12px;color:var(--mute);margin-top:1px}
  .c-dnote{color:var(--mute);font-size:13px}
  .c-dl{width:170px;text-align:right}

  /* 계산기 */
  .calcwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .pbody{padding:18px 20px}
  .seg{display:flex;background:var(--gray-soft);border:1px solid var(--line);border-radius:8px;padding:3px;gap:3px;margin-bottom:14px}
  .seg button{flex:1;border:none;background:none;color:var(--mute);padding:8px 4px;border-radius:6px;font:500 13.5px inherit;cursor:pointer}
  .seg button.on{background:var(--panel);box-shadow:0 1px 2px rgba(16,24,40,.12);font-weight:700;color:var(--ink)}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:#3b4559}
  .field .hint{font-size:12px;color:var(--mute);margin-top:4px}
  .field input[type=text],.field select{width:100%;padding:10px 12px;font:15px inherit;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
  .field input[type=text]:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  #amt{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .checks{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
  .checks label{display:flex;align-items:center;gap:5px;font-weight:400}
  .res-panel{position:sticky;top:16px}
  #calcResult:empty::before{content:"왼쪽에 금액을 입력하면 결과가 여기에 표시됩니다.";display:block;color:var(--mute);padding:36px 0;text-align:center}
  .big{display:flex;justify-content:space-between;align-items:baseline;padding:4px 0 14px;border-bottom:2px solid var(--ink);margin-bottom:6px}
  .big span{font-size:13px;color:var(--mute);font-weight:600}
  .big b{font-size:28px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .rtable{width:100%;border-collapse:collapse;font-size:13.5px}
  .rtable td{padding:8px 0;border-bottom:1px solid var(--line2)}
  .rtable td:last-child{text-align:right;font-variant-numeric:tabular-nums}
  .rtable tr.sub td{color:var(--mute);font-size:12.5px;padding-left:14px}
  .rtable tr.total td{font-weight:700;border-bottom:none;border-top:1px solid var(--ink);font-size:14.5px}
  .cnote{font-size:12px;color:var(--mute);margin-top:12px;line-height:1.7;background:var(--head);border:1px solid var(--line2);border-radius:8px;padding:10px 12px}
  .copy{margin-top:12px;width:100%;padding:10px;border:1px solid var(--ink);background:var(--ink);color:#fff;border-radius:8px;font:600 13.5px inherit;cursor:pointer}
  .copy:hover{background:#26324d}

  /* 할 일 */
  .todo{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:10px;margin:0 0 18px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .todo-h{display:flex;align-items:center;gap:8px;padding:11px 18px;border-bottom:1px solid var(--line2);font-weight:700;font-size:13.5px}
  .todo-h .n{font-size:11.5px;font-weight:500;color:var(--mute);border:1px solid var(--line);padding:0 7px;border-radius:999px}
  .todo-h small{margin-left:auto;font-weight:400;color:var(--mute);font-size:12px}
  .todo ul{list-style:none;margin:0;padding:4px 0}
  .todo li{display:grid;grid-template-columns:78px 96px minmax(0,1fr);gap:12px;align-items:center;padding:9px 18px}
  .todo li + li{border-top:1px dashed var(--line2)}
  .dday{font-size:12px;font-weight:800;text-align:center;padding:3px 0;border-radius:6px;background:var(--gray-soft);color:var(--mute)}
  .dday.soon{background:var(--warn-soft);color:var(--warn)}
  .dday.urgent{background:var(--red-soft);color:var(--red)}
  .tdate{font-size:12.5px;color:var(--mute);font-variant-numeric:tabular-nums}
  .ttxt{font-weight:600;font-size:14px}
  .ttxt span{font-weight:400;color:var(--mute);font-size:12.5px;margin-left:6px}
  @media (max-width:900px){ .todo li{grid-template-columns:64px minmax(0,1fr)} .tdate{display:none} }
  footer{margin-top:30px;color:var(--mute);font-size:12px;border-top:1px solid var(--line);padding-top:14px}

  /* ── 좁은 화면 (휴대폰) ── */
  @media (max-width:900px){
    .app{display:block}
    .side{position:sticky;height:auto;padding:12px 12px 8px;z-index:10;overflow:visible}
    .brand{padding:0 4px 10px;margin-bottom:8px}
    .brand .mk{width:28px;height:28px;font-size:13px}
    .nav-label,.side-box{display:none}
    .nav{flex-direction:row;overflow-x:auto;gap:4px;scrollbar-width:none}
    .nav-i{width:auto;white-space:nowrap;padding:7px 11px;font-size:13px}
    .nav-i em{display:none}
    .nav-i.on{box-shadow:inset 0 -2px 0 var(--gold)}
    .main{padding:16px 14px 40px}
    .top{flex-direction:column;align-items:stretch;gap:12px}
    .search{width:100%}
    .search kbd{display:none}
    .md,.calcwrap{grid-template-columns:1fr}
    .mlist,.res-panel{position:static;max-height:280px}
    .res-panel{max-height:none}
    .c-tags,.tbl th.h-tags{display:none}
    .c-name{width:auto}
    .tbl td{padding:11px 12px}
    .tbl tr{display:grid;grid-template-columns:28px 1fr auto}
    .tbl .c-desc{grid-column:2 / 4;padding-top:0}
    .tbl thead{display:none}
    .docs .tbl tr{grid-template-columns:62px 1fr}
    .docs .c-dnote,.docs .c-dl{grid-column:2;text-align:left;padding-top:0}
    .srow{grid-template-columns:28px minmax(0,1fr)}
    .srow .sw{grid-column:2}
    .srow .sb{grid-column:2}
    .d-head,.d-sec{padding-left:16px;padding-right:16px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="mk">稅</div><div><b>세무 업무 포털</b><small>TAX WORK CONSOLE</small></div></div>
    <div class="nav-label">메뉴</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-box">
      <h5 id="todayH"></h5>
      <ul id="today"></ul>
      <div class="sync" id="sync">구글 시트 불러오는 중…</div>
    </div>
  </aside>

  <main class="main">
    <div class="top">
      <div>
        <div class="crumb">세무 업무 포털 › <b id="crumb"></b></div>
        <h1 id="title"></h1>
        <p id="subtitle"></p>
      </div>
      <div class="search" id="searchBox">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" id="q" placeholder="" autocomplete="off">
        <kbd>/</kbd>
      </div>
    </div>
    <div id="todo"></div>
    <div class="subtabs" id="tabs"></div>

    <div id="list"></div>

    <div id="calcBox" class="hidden">
      <div class="calcwrap">
        <div class="panel">
          <div class="panel-h">입력</div>
          <div class="pbody">
            <div class="seg" id="kind">
              <button data-k="work" class="on">근로소득</button>
              <button data-k="biz">사업소득 3.3%</button>
              <button data-k="etc">기타소득</button>
            </div>
            <div class="seg" id="dir">
              <button data-d="rev" class="on">세후 → 세전</button>
              <button data-d="fwd">세전 → 세후</button>
            </div>
            <div class="field">

const LAB_NAME  = {"포함":"포함","제외":"제외","예외":"예외","주의":"주의","회사":"회사 방식","참고":"참고"};

function renderProcs(q, SRC){

  const main=p.steps.filter(x=>!x[3]);
  let body="";
  if(main.length){
    body+=`<div class="d-sec"><ol class="steps">${main.map(s=>`<li><div class="sl">${siteTag(s[0])}<b>${esc(s[1])}</b></div>${s[2]?`<div class="sn">${esc(s[2])}</div>`:""}</li>`).join("")}</ol></div>`;
  }
  const inc=p.steps.filter(x=>x[3]==="포함"), exc=p.steps.filter(x=>x[3]==="제외");
  if(inc.length||exc.length){
    const col=(rows,cls,title)=>`<div class="ie ${cls}"><h4>${title} <span class="n">${rows.length}</span></h4><ul>${rows.map(s=>`<li><b>${esc(s[1])}</b>${s[2]?`<span>${esc(s[2])}</span>`:""}</li>`).join("")}</ul></div>`;
    body+=`<div class="d-sec"><div class="ie-wrap">${col(inc,"in","✅ 포함")}${col(exc,"ex","❌ 제외")}</div></div>`;
  }
  const labs=[...LAB_ORDER.filter(l=>l!=="포함"&&l!=="제외"), ...new Set(p.steps.map(x=>x[3]).filter(l=>l&&!LAB_ORDER.includes(l)))];
  for(const l of labs){
    const rows=p.steps.filter(x=>x[3]===l); if(!rows.length) continue;
    body+=`<div class="d-sec"><h4><span class="chip ch-${esc(l)}">${esc(LAB_NAME[l]||l)}</span></h4><ul class="notes">${rows.map(s=>`<li>${s[0]?siteTag(s[0])+" ":""}<b>${esc(s[1])}</b>${s[2]?` — ${esc(s[2])}`:""}</li>`).join("")}</ul></div>`;

  return `<div class="md">

    <div class="panel detail" id="detail"><div class="d-head"><h2>${esc(p.n)}</h2>${p.d?`<p>${esc(p.d)}</p>`:""}</div>${body}</div>

/* ============================================================
   급여 계산기 (2026년 기준)
   ============================================================ */
const RATE = {
  nps:0.0475, npsMin:410000, npsMax:6590000,      // 국민연금 근로자 4.75%, 기준소득월액 41만~659만 (2026.7~2027.6)
  nhis:0.0719, ltc:0.009448,                        // 건강보험 7.19%(근로자 절반), 장기요양 0.9448% (=건보료의 13.14%)
  ei:0.009                                          // 고용보험 근로자 0.9%
};
const f10 = x => Math.floor(x/10)*10;              // 10원 미만 절사
const won = x => Math.round(x).toLocaleString("ko-KR")+"원";
const num = s => parseInt(String(s).replace(/[^\d]/g,""),10)||0;

function insurance(base, opt){
  const npsBase = Math.min(Math.max(Math.floor(base/1000)*1000, RATE.npsMin), RATE.npsMax);
  const nps  = opt.nps  && base>0 ? f10(npsBase*RATE.nps) : 0;
  const nhis = opt.nhis && base>0 ? f10(base*RATE.nhis/2) : 0;
  const ltc  = opt.nhis && base>0 ? f10(nhis*RATE.ltc/RATE.nhis) : 0;
  const ei   = opt.ei   && base>0 ? f10(base*RATE.ei) : 0;
  return {nps,nhis,ltc,ei,total:nps+nhis+ltc+ei};
}

/* 근로소득 간이세액표 산식(소득세법 시행령 별표2 작성방법)에 따른 추정 */
function earnedDeduction(T){
  let d;
  if(T<=5e6) d=T*0.7;
  else if(T<=15e6) d=3.5e6+(T-5e6)*0.4;
  else if(T<=45e6) d=7.5e6+(T-15e6)*0.15;
  else if(T<=1e8) d=12e6+(T-45e6)*0.05;
  else d=14.75e6+(T-1e8)*0.02;
  return Math.min(d,2e7);
}
function specialDeduction(T,n){
  const a = n<=1?[3.1e6,0.04,0.015,0.005] : n===2?[3.6e6,0.04,0.02,0.01] : [5e6,0.07,0.05,0.03];
  if(T<=3e7)  return a[0]+T*a[1]+(n>=3?Math.max(T-4e7,0)*0.04:0);
  if(T<=4.5e7) return a[0]+T*a[1]-(T-3e7)*0.05+(n>=3?Math.max(T-4e7,0)*0.04:0);
  if(T<=7e7)  return a[0]+T*a[2];
  return a[0]+T*a[3];
}
function progressive(base){
  const B=[[14e6,.06,0],[5e7,.15,1.26e6],[8.8e7,.24,5.76e6],[1.5e8,.35,15.44e6],[3e8,.38,19.94e6],[5e8,.40,25.94e6],[1e9,.42,35.94e6],[Infinity,.45,65.94e6]];
  for(const [lim,r,c] of B) if(base<=lim) return Math.max(base*r-c,0);
}
function earnedCredit(calc,T){
  const c = calc<=1.3e6 ? calc*0.55 : 715000+(calc-1.3e6)*0.3;
  let lim;
  if(T<=3.3e7) lim=740000;
  else if(T<=7e7) lim=Math.max(740000-(T-3.3e7)*0.008,660000);
  else if(T<=1.2e8) lim=Math.max(660000-(T-7e7)*0.005,500000);
  else lim=Math.max(500000-(T-1.2e8)*0.005,200000);
  return Math.min(c,lim);
}
function simpleTax(monthly, n, ratio){
  if(monthly<1060000) return 0;
  const w = monthly<1.5e6?5000 : monthly<3e6?10000 : 20000;
  const mid = Math.floor(monthly/w)*w + w/2;
  const T = mid*12;
  const npsBase = Math.min(Math.max(Math.floor(mid/1000)*1000, RATE.npsMin), RATE.npsMax);
  const pension = npsBase*0.045*12;   // 현행 간이세액표는 국민연금 4.5% 기준으로 작성됨
  const base = Math.max(T-earnedDeduction(T)-1.5e6*n-pension-specialDeduction(T,n),0);
  const calc = progressive(base);
  const annual = Math.max(calc-earnedCredit(calc,T),0);
  return f10(annual/12);
}
function childCredit(k){ return k<=0?0 : k===1?20830 : 45830+(k-2)*33330; }  // 8세 이상 20세 이하 자녀
function workTax(monthly,n,kids,ratio){
  return f10(Math.max(simpleTax(monthly,n)-childCredit(kids),0)*ratio);
}

function compute(kind, gross, o){
  if(kind==="work"){
    const taxable=Math.max(gross-o.nontax,0);
    const ins=insurance(taxable,o);
    const tax=workTax(taxable,o.fam,o.kids,o.ratio);
    const local=f10(tax*0.1);
    return {gross, rows:[["국민연금",ins.nps],["건강보험",ins.nhis],["장기요양",ins.ltc],["고용보험",ins.ei],["소득세",tax],["지방소득세",local]],
            ded:ins.total+tax+local, net:gross-ins.total-tax-local};
  }
  if(kind==="biz"){
    let tax=f10(gross*0.03); if(tax<1000) tax=0;   // 소액부징수
    const local=f10(tax*0.1);
    return {gross, rows:[["소득세 (3%)",tax],["지방소득세 (0.3%)",local]], ded:tax+local, net:gross-tax-local};
  }
  // 기타소득
  const income=gross*(1-o.etcExp);
  let tax = income<=50000 ? 0 : f10(income*0.2);   // 과세최저한: 기타소득금액 5만원 이하
  if(tax<1000) tax=0;
  const local=f10(tax*0.1);
  return {gross, rows:[["필요경비",-(gross-Math.floor(income)),"sub"],["기타소득금액",Math.floor(income),"sub"],["소득세 (20%)",tax],["지방소득세 (2%)",local]], ded:tax+local, net:gross-tax-local};
}

/* 세후 → 세전: 실수령액이 목표 이상이 되는 가장 작은 세전 금액 */
function solve(kind, target, o){
  const net=g=>compute(kind,g,o).net;
  if(net(target)>=target) return target;           // 공제가 없는 구간
  let lo=target, hi=target*2+100000;
  while(net(hi)<target) hi*=2;
  while(hi-lo>1){ const m=Math.floor((lo+hi)/2); if(net(m)>=target) hi=m; else lo=m; }
  const win = kind==="work" ? 40000 : 2000;        // 구간·절사 때문에 생기는 계단 보정
  for(let g=Math.max(target,hi-win); g<=hi; g++) if(net(g)>=target) return g;
  return hi;
}

let cKind="work", cDir="rev";
function calcRender(){
  const amt=num(document.getElementById("amt").value);
  const o={
    nontax:num(document.getElementById("nontax").value),
    fam:parseInt(document.getElementById("fam").value,10)||1,
    kids:parseInt(document.getElementById("kids").value,10)||0,
    ratio:parseFloat(document.getElementById("ratio").value)||1,
    nps:document.getElementById("iNps").checked,
    nhis:document.getElementById("iNhis").checked,
    ei:document.getElementById("iEi").checked,
    etcExp:parseFloat(document.getElementById("etcExp").value)
  };
  document.getElementById("workOpts").classList.toggle("hidden",cKind!=="work");
  document.getElementById("etcOpts").classList.toggle("hidden",cKind!=="etc");
  document.getElementById("amtLabel").textContent = cDir==="rev" ? "실수령액 (세후)" : "지급액 (세전)";
  document.getElementById("amtHint").textContent = cKind==="work"
    ? (cDir==="rev"?"비과세 포함, 통장에 들어오는 금액":"비과세 포함 총 지급액")

  const box=document.getElementById("calcResult");

    if(o.kids) notes.push(`자녀 ${o.kids}명 공제 ${won(childCredit(o.kids))}을 간이세액표 금액에서 뺐습니다.`);
    if(gross-o.nontax>1e7) notes.push("⚠️ 과세급여 월 1천만원 초과는 간이세액표 별도 산식이 적용돼 이 계산이 맞지 않습니다.");
  } else if(cKind==="biz"){
    notes.push("소득세 3% + 지방소득세 0.3%. 소득세가 1,000원 미만이면 징수하지 않습니다(소액부징수).");
  } else {
    notes.push("기타소득금액(지급액 − 필요경비)이 5만원 이하면 과세하지 않습니다(과세최저한).");
  }
  if(diff>0) notes.push(`10원 단위 절사·세액 구간 때문에 실수령액이 목표보다 ${won(diff)} 많게 나옵니다.`);

  box.innerHTML = `<div class="result">
    <div class="big"><span>${cDir==="rev"?"세전 지급액":"실수령액"}</span><b>${won(cDir==="rev"?r.gross:r.net)}</b></div>
    <table class="rtable">
      <tr><td>세전 지급액${cKind==="work"&&o.nontax?` <span style="color:var(--muted);font-size:12px">(비과세 ${won(o.nontax)} 포함)</span>`:""}</td><td>${won(r.gross)}</td></tr>
      ${rows.map(x=>`<tr class="${x[2]||""}"><td>${x[0]}</td><td>${x[2]?won(x[1]):"− "+won(x[1])}</td></tr>`).join("")}
      <tr><td>공제 합계</td><td>− ${won(r.ded)}</td></tr>
      <tr class="total"><td>실수령액</td><td>${won(r.net)}</td></tr>
    </table>
    <button class="copy" id="copyBtn">결과 복사</button>
    <div class="cnote">${notes.map(n=>"· "+n).join("<br>")}</div>
  </div>`;
  document.getElementById("copyBtn").onclick=async e=>{
    const txt=`[${label}] 세전 ${won(r.gross)} / `+rows.filter(x=>!x[2]).map(x=>`${x[0]} ${won(x[1])}`).join(", ")+` / 공제계 ${won(r.ded)} / 실수령 ${won(r.net)}`;
    try{ await navigator.clipboard.writeText(txt); e.target.textContent="복사됨 ✓"; }
    catch(err){ e.target.textContent="복사 실패 — 직접 선택해 복사하세요"; }
    setTimeout(()=>{ e.target.textContent="결과 복사"; },1800);
  };
}

/* ---------- 구글 시트 불러오기 ---------- */
function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===','){ row.push(cell); cell=""; }
    else if(ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(ch!=='\r') cell+=ch;
  }
  if(cell!==""||row.length){ row.push(cell); rows.push(row); }
  return rows.map(r=>r.map(c=>c.replace(/^﻿/,"").trim()));
}
function gvizJsonp(url){
  // fetch가 막힐 때 쓰는 예비 방식: 구글 시트를 <script>로 불러옴
  return new Promise((resolve,reject)=>{
    const cb="gv"+Math.random().toString(36).slice(2);
    const src=url.replace("tqx=out:csv","headers=1&tqx=responseHandler:"+cb)+"&t="+Date.now();
    const el=document.createElement("script");
    const done=()=>{ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } el.remove(); };
    const timer=setTimeout(()=>{ done(); reject(new Error("timeout")); },10000);
    window[cb]=d=>{
      clearTimeout(timer); done();
      if(!d||d.status==="error"||!d.table){ reject(new Error("gviz error")); return; }
      resolve(d.table.rows.map(r=>(r.c||[]).map(c=>c==null?"":String(c.v==null?(c.f||""):c.v).trim())));
    };
    el.onerror=()=>{ clearTimeout(timer); done(); reject(new Error("script error")); };
    el.src=src; document.head.appendChild(el);
  });
}
let SYNC={ok:0,fail:0};
async function fetchCSV(url, quiet){
  try{
    const res=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
    if(!res.ok) throw new Error(res.status);
    const rows=parseCSV(await res.text()).slice(1);
    if(!quiet) SYNC.ok++; return rows;
  }catch(e){
    try{ const rows=await gvizJsonp(url); if(!quiet) SYNC.ok++; return rows; }
    catch(e2){ if(!quiet) SYNC.fail++; throw e2; }
  }
}
function showSync(){
  const el=document.getElementById("sync"); if(!el) return;
  const t=new Date(); const hm=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
  el.textContent = SYNC.fail===0&&SYNC.ok>0 ? `🟢 구글 시트 연결됨 · ${hm}`
    : SYNC.ok>0 ? `🟡 일부 탭만 연결됨 · ${hm}` : `🔴 시트 연결 안 됨 · 기본 목록 표시 중`;
}

function toProcs(rows){
  const map=new Map(); let last=null;
  for(const r of rows){
    const name=r[0]||last; if(!name) continue; last=name;   // 이름 칸을 비우면 윗줄에 이어짐
    if(!map.has(name)) map.set(name,{n:name,d:r[1]||"",steps:[]});
    const p=map.get(name); if(!p.d&&r[1]) p.d=r[1];
    if(r[4]){ const nn=parseFloat(r[2]); const lab=isNaN(nn)?(r[2]||"").trim():""; p.steps.push({o:isNaN(nn)?1000+p.steps.length:nn, s:[r[3]||"",r[4],r[5]||"",lab]}); }
  }
  return [...map.values()].filter(p=>p.steps.length).map(p=>({n:p.n,d:p.d,steps:p.steps.sort((a,b)=>a.o-b.o).map(x=>x.s)}));
}
const toDocs = rows => rows.filter(r=>r[0]&&r[1]).map(r=>[0,1,2,3,4,5,6].map(i=>r[i]||""));


/* ---------- 할 일 (시트 '할일' 탭: 날짜 | 할 일 | 메모 | 완료) ---------- */
let TODOS = [];
function parseDay(t){
  const m=String(t||"").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function renderTodo(){
  const box=document.getElementById("todo");
  const today=new Date(); today.setHours(0,0,0,0);
  const list=TODOS.map(r=>({d:parseDay(r[0]),t:r[1]||"",m:r[2]||"",done:/^(o|O|ㅇ|완료|v|V|✓|y|Y|TRUE)$/.test((r[3]||"").trim())}))
    .filter(x=>x.d&&x.t&&!x.done).sort((a,b)=>a.d-b.d);
  if(!list.length){ box.innerHTML=""; return; }
  const W="일월화수목금토";
  box.innerHTML=`<div class="todo"><div class="todo-h">📌 내 할 일 <span class="n">${list.length}</span><small>완료하면 시트 '할일' 탭 완료 칸에 O</small></div><ul>`+
    list.map(x=>{
      const diff=Math.round((x.d-today)/86400000);
      const lab = diff===0?"오늘":diff>0?`D-${diff}`:`${-diff}일 지남`;
      const cls = diff<=1?"urgent":diff<=7?"soon":"";
      return `<li><span class="dday ${cls}">${lab}</span><span class="tdate">${x.d.getMonth()+1}.${x.d.getDate()} (${W[x.d.getDay()]})</span><span class="ttxt">${esc(x.t)}${x.m?`<span>${esc(x.m)}</span>`:""}</span></li>`;
    }).join("")+`</ul></div>`;
}

async function loadSheets(){
  const jobs = [
    fetchCSV(SHEET_CSV_URL).then(rows=>{
      const list=rows.map(r=>({c:r[0]||"",n:r[1]||"",u:r[2]||"",d:r[3]||"",t:(r[4]||"").split(/[,\/]/).map(x=>x.trim()).filter(Boolean)})).filter(s=>s.c&&s.n&&s.u);
      list.forEach(s=>{ if(!/^https?:\/\//.test(s.u)) s.u="https://"+s.u; });
      if(list.length){ SITES=list; refreshCats(); }
    }),
    fetchCSV(PROC_CSV_URL).then(rows=>{ const l=toProcs(rows); if(l.length) PROCS=l; }),
    fetchCSV(SAMU_CSV_URL).then(rows=>{ const l=toProcs(rows); if(l.length) SAMU=l; }),
    fetchCSV(DOCS_CSV_URL).then(rows=>{ const l=toDocs(rows); if(l.length) DOCS=l; }),
  ];
  const res = await Promise.allSettled(jobs);
  res.forEach(r=>{ if(r.status==="rejected") console.warn("시트를 못 불러와 기본 목록을 씁니다.", r.reason); });
  syncData();

  // '메뉴' 탭에 적힌 추가 메뉴 (파일을 다시 올리지 않아도 메뉴가 생김)
  try{
    const rows = await fetchCSV(tabURL(MENU_TAB), true);
    const extras = rows.filter(r=>r[0]&&r[1]&&/^(절차|서류|)$/.test((r[3]||"").trim()));
    const loaded = await Promise.allSettled(extras.map(r=>fetchCSV(tabURL(r[1]), true)));
    extras.forEach((r,i)=>{
      if(loaded[i].status!=="fulfilled") return;
      const isDocs=(r[3]||"").trim()==="서류";
      const raw = loaded[i].value;
      // 없는 탭 이름이면 구글이 첫 탭을 돌려줄 수 있어 형식 검사
      const okFmt = isDocs ? raw.some(x=>/^(서식|첨부|발급|안내)$/.test(x[2]||"")) : raw.some(x=>/^\d+(\.\d+)?$/.test((x[2]||"").trim()));
      if(!okFmt) return;
      const data = isDocs ? toDocs(raw) : toProcs(raw);
      if(!data.length) return;
      const id="t-"+r[1];
      MENU = MENU.filter(m=>m.id!==id);
      MENU.splice(MENU.length-1, 0, {id, label:r[0], type:isDocs?"docs":"procs", ic:isDocs?"docs":"folder", emoji:(r[2]||"").trim(), desc:r[1]+" 탭에서 불러옴", ph:r[0]+" 검색"});
      DATA[id]=data;
    });
    if(MENU.some(m=>m.id===wanted) && mode!==wanted) mode=wanted;
  }catch(e){ /* 메뉴 탭이 없으면 기본 메뉴만 */ }

  try{
    const rows = await fetchCSV(tabURL("할일"), true);
    if(rows.every(r=>!r[0] || parseDay(r[0]))) TODOS = rows;   // 날짜 형식이 맞을 때만 (없는 탭이면 무시)
  }catch(e){}
  renderTodo(); renderControls(); render(); showSync();
}

refreshCats(); renderToday(); renderTodo(); renderControls(); render(); loadSheets();
